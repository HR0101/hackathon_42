<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Master Controller</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0f1117;
      --surface:  #1c1f2e;
      --border:   #2e3150;
      --text:     #e2e6f0;
      --muted:    #6b7280;
      --green:    #22c55e;
      --green-dk: #15803d;
      --red:      #ef4444;
      --red-dk:   #b91c1c;
      --blue:     #3b82f6;
      --blue-dk:  #1d4ed8;
      --amber:    #f59e0b;
      --amber-dk: #b45309;
      --purple:   #a855f7;
      --purple-dk:#7e22ce;
    }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
      gap: 20px;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: var(--text);
    }
    h1 span { color: var(--amber); }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px;
      width: 100%;
      max-width: 480px;
    }

    .card-title {
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 14px;
    }

    /* ── Connection ─────────────────────────────── */
    .conn-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--red);
      flex-shrink: 0;
      transition: background 0.3s;
    }
    .dot.connected { background: var(--green); box-shadow: 0 0 8px var(--green); }

    .conn-label {
      font-size: 0.85rem;
      color: var(--muted);
      flex: 1;
    }
    .conn-label.connected { color: var(--green); }

    /* ── Buttons ────────────────────────────────── */
    button {
      cursor: pointer;
      border: none;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      padding: 10px 18px;
      transition: filter 0.15s, transform 0.1s;
      line-height: 1;
    }
    button:active { transform: scale(0.95); }
    button:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }
    button:not(:disabled):hover { filter: brightness(1.15); }

    .btn-connect {
      background: var(--blue);
      color: #fff;
      padding: 8px 16px;
      font-size: 0.85rem;
    }
    .btn-disconnect {
      background: #374151;
      color: var(--text);
      padding: 8px 16px;
      font-size: 0.85rem;
    }

    /* ── Transport ──────────────────────────────── */
    .transport {
      display: flex;
      gap: 12px;
    }
    .btn-play {
      flex: 1;
      background: var(--green);
      color: #fff;
      font-size: 1.1rem;
      padding: 18px;
    }
    .btn-play.active {
      background: var(--green);
      box-shadow: 0 0 16px var(--green);
    }
    .btn-stop {
      flex: 1;
      background: var(--red);
      color: #fff;
      font-size: 1.1rem;
      padding: 18px;
    }
    .btn-stop.active {
      background: var(--red);
      box-shadow: 0 0 16px var(--red);
    }

    /* ── BPM ────────────────────────────────────── */
    .bpm-display {
      font-size: 3.5rem;
      font-weight: 800;
      text-align: center;
      color: var(--amber);
      letter-spacing: -0.02em;
      line-height: 1;
      margin: 8px 0;
    }
    .bpm-label {
      text-align: center;
      font-size: 0.7rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 14px;
    }
    .bpm-controls {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .btn-bpm-step {
      background: var(--amber-dk);
      color: #fff;
      font-size: 1.3rem;
      width: 52px;
      height: 52px;
      padding: 0;
      flex-shrink: 0;
    }
    .bpm-input-wrap {
      flex: 1;
      display: flex;
      gap: 8px;
    }
    .bpm-input-wrap input {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 1rem;
      padding: 10px 12px;
      text-align: center;
      outline: none;
    }
    .bpm-input-wrap input:focus {
      border-color: var(--amber);
    }
    .btn-bpm-set {
      background: var(--amber);
      color: #111;
      font-size: 0.85rem;
      padding: 10px 14px;
    }

    /* ── Tools ──────────────────────────────────── */
    .tools {
      display: flex;
      gap: 10px;
    }
    .btn-sync   { flex: 1; background: var(--purple-dk); color: #fff; }
    .btn-status { flex: 1; background: #374151; color: var(--text); }
    .btn-help   { flex: 1; background: #374151; color: var(--text); }

    /* ── Log ────────────────────────────────────── */
    .log-box {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      height: 180px;
      overflow-y: auto;
      padding: 10px;
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 0.75rem;
      line-height: 1.6;
    }
    .log-row { white-space: pre-wrap; word-break: break-all; }
    .log-row.send { color: #60a5fa; }
    .log-row.recv { color: #d1d5db; }
    .log-row.err  { color: #f87171; }
    .log-row.info { color: #6b7280; }

    .log-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .btn-clear {
      background: none;
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 0.72rem;
      padding: 3px 8px;
      border-radius: 6px;
    }

    /* ── Warning banner ─────────────────────────── */
    .warn {
      background: #292524;
      border: 1px solid #78350f;
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 0.8rem;
      color: #d97706;
      max-width: 480px;
      width: 100%;
      display: none;
    }
    .warn.visible { display: block; }
  </style>
</head>
<body>

  <h1>🐸 Master Controller</h1>

  <div class="warn" id="warn">
    ⚠️ Web Serial API はこのブラウザでは使用できません。<br>
    <strong>Chrome</strong> または <strong>Edge</strong> (バージョン 89 以上) で開いてください。<br>
    また、<code>file://</code> で動作しない場合はローカルサーバーを使用してください。
  </div>

  <!-- Connection -->
  <div class="card">
    <div class="card-title">シリアル接続</div>
    <div class="conn-row">
      <div class="dot" id="dot"></div>
      <span class="conn-label" id="conn-label">未接続 (115200 baud)</span>
      <button class="btn-connect" id="btn-connect" onclick="toggleConnect()">接続</button>
    </div>
  </div>

  <!-- Transport -->
  <div class="card">
    <div class="card-title">再生制御</div>
    <div class="transport">
      <button class="btn-play" id="btn-play" onclick="cmdPlay()" disabled>▶ PLAY</button>
      <button class="btn-stop" id="btn-stop" onclick="cmdStop()" disabled>■ STOP</button>
    </div>
  </div>

  <!-- BPM -->
  <div class="card">
    <div class="card-title">BPM</div>
    <div class="bpm-display" id="bpm-display">120</div>
    <div class="bpm-label">beats per minute</div>
    <div class="bpm-controls">
      <button class="btn-bpm-step" id="btn-bpm-dn" onclick="cmdBpmDown()" disabled>−</button>
      <div class="bpm-input-wrap">
        <input type="number" id="bpm-input" value="120" min="40" max="240" step="1"
               placeholder="40〜240" onkeydown="if(event.key==='Enter') cmdBpmSet()">
        <button class="btn-bpm-set" id="btn-bpm-set" onclick="cmdBpmSet()" disabled>SET</button>
      </div>
      <button class="btn-bpm-step" id="btn-bpm-up" onclick="cmdBpmUp()" disabled>＋</button>
    </div>
  </div>

  <!-- Tools -->
  <div class="card">
    <div class="card-title">ツール</div>
    <div class="tools">
      <button class="btn-sync"   id="btn-sync"   onclick="cmdSync()"   disabled>SYNC</button>
      <button class="btn-status" id="btn-status" onclick="cmdStatus()" disabled>STATUS</button>
      <button class="btn-help"   id="btn-help"   onclick="cmdHelp()"   disabled>HELP</button>
    </div>
  </div>

  <!-- Log -->
  <div class="card">
    <div class="log-header">
      <div class="card-title" style="margin-bottom:0">シリアルログ</div>
      <button class="btn-clear" onclick="clearLog()">クリア</button>
    </div>
    <div class="log-box" id="log-box"></div>
  </div>

<script>
'use strict';

// ─── State ───────────────────────────────────────────────────
let port     = null;
let writer   = null;
let isConnected = false;
let bpm      = 120;
let playing  = false;

const BPM_MIN  = 40;
const BPM_MAX  = 240;
const BPM_STEP = 5;
const BAUD     = 115200;

// ─── Init ─────────────────────────────────────────────────────
if (!('serial' in navigator)) {
  document.getElementById('warn').classList.add('visible');
  document.getElementById('btn-connect').disabled = true;
}

// ─── Connection ───────────────────────────────────────────────
async function toggleConnect() {
  if (isConnected) {
    await disconnect();
  } else {
    await connect();
  }
}

async function connect() {
  try {
    port = await navigator.serial.requestPort();
    await port.open({ baudRate: BAUD });

    // Writer
    const encStream = new TextEncoderStream();
    encStream.readable.pipeTo(port.writable);
    writer = encStream.writable.getWriter();

    isConnected = true;
    updateConnUI(true);
    logMsg('接続しました (115200 baud)', 'info');

    // Reader loop
    startReadLoop();

  } catch (err) {
    if (err.name !== 'NotFoundError') {           // user cancelled → silent
      logMsg('接続失敗: ' + err.message, 'err');
    }
  }
}

async function disconnect() {
  try {
    if (writer) { await writer.close(); writer = null; }
    if (port)   { await port.close();   port   = null; }
  } catch (_) {}
  isConnected = false;
  playing     = false;
  updateConnUI(false);
  updatePlayUI();
  logMsg('切断しました', 'info');
}

async function startReadLoop() {
  const dec = new TextDecoderStream();
  const pipePromise = port.readable.pipeTo(dec.writable);
  const reader = dec.readable.getReader();
  let buf = '';
  try {
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += value;
      const lines = buf.split('\n');
      buf = lines.pop();
      for (const line of lines) {
        const t = line.replace(/\r/g, '').trimEnd();
        if (t) logMsg(t, 'recv');
      }
    }
  } catch (err) {
    if (isConnected) logMsg('受信エラー: ' + err.message, 'err');
  } finally {
    reader.releaseLock();
  }
}

// ─── Send ─────────────────────────────────────────────────────
async function send(cmd) {
  if (!writer) return;
  try {
    await writer.write(cmd + '\n');
    logMsg('> ' + cmd, 'send');
  } catch (err) {
    logMsg('送信失敗: ' + err.message, 'err');
  }
}

// ─── Commands ─────────────────────────────────────────────────
async function cmdPlay() {
  await send('play');
  playing = true;
  updatePlayUI();
}

async function cmdStop() {
  await send('stop');
  playing = false;
  updatePlayUI();
}

async function cmdBpmUp() {
  const next = Math.min(bpm + BPM_STEP, BPM_MAX);
  if (next !== bpm) {
    bpm = next;
    updateBpmDisplay();
    await send('bpm+');
  }
}

async function cmdBpmDown() {
  const next = Math.max(bpm - BPM_STEP, BPM_MIN);
  if (next !== bpm) {
    bpm = next;
    updateBpmDisplay();
    await send('bpm-');
  }
}

async function cmdBpmSet() {
  const raw = parseInt(document.getElementById('bpm-input').value, 10);
  if (isNaN(raw) || raw < BPM_MIN || raw > BPM_MAX) {
    logMsg(`BPM は ${BPM_MIN}〜${BPM_MAX} の範囲で入力してください`, 'err');
    return;
  }
  bpm = raw;
  updateBpmDisplay();
  await send('bpm ' + bpm);
}

async function cmdSync()   { await send('sync');   }
async function cmdStatus() { await send('status'); }
async function cmdHelp()   { await send('help');   }

// ─── UI helpers ───────────────────────────────────────────────
function updateConnUI(connected) {
  const dot   = document.getElementById('dot');
  const label = document.getElementById('conn-label');
  const btn   = document.getElementById('btn-connect');
  const controlled = [
    'btn-play','btn-stop',
    'btn-bpm-up','btn-bpm-dn','btn-bpm-set',
    'btn-sync','btn-status','btn-help'
  ];

  dot.classList.toggle('connected', connected);
  label.textContent = connected ? '接続中 (115200 baud)' : '未接続 (115200 baud)';
  label.classList.toggle('connected', connected);
  btn.textContent = connected ? '切断' : '接続';
  btn.className   = connected ? 'btn-disconnect' : 'btn-connect';

  controlled.forEach(id => {
    document.getElementById(id).disabled = !connected;
  });
}

function updatePlayUI() {
  const play = document.getElementById('btn-play');
  const stop = document.getElementById('btn-stop');
  play.classList.toggle('active',  playing);
  stop.classList.toggle('active', !playing && isConnected);
}

function updateBpmDisplay() {
  document.getElementById('bpm-display').textContent = bpm;
  document.getElementById('bpm-input').value = bpm;
}

// ─── Log ──────────────────────────────────────────────────────
const MAX_LOG = 300;

function logMsg(text, type = 'info') {
  const box  = document.getElementById('log-box');
  const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 40;

  const row = document.createElement('div');
  row.className = 'log-row ' + type;
  row.textContent = text;
  box.appendChild(row);

  // trim old entries
  while (box.childElementCount > MAX_LOG) {
    box.removeChild(box.firstChild);
  }

  if (atBottom) box.scrollTop = box.scrollHeight;
}

function clearLog() {
  document.getElementById('log-box').innerHTML = '';
}
</script>
</body>
</html>
